# Generated from datasets/golden.jsonl by `aiq promptfoo-tests`. Do not edit by hand.

- description: "ret-01 (returns)"
  vars:
    question: "How many days do I have to return my earbuds?"
  assert:
    - type: icontains-all
      value: ["30 days"]
    - type: not-icontains
      value: "60 days"
    - type: not-icontains
      value: "90 days"
- description: "ret-02 (returns)"
  vars:
    question: "When will I get my refund after returning an item?"
  assert:
    - type: icontains-all
      value: ["5-7 business days"]
- description: "shp-01 (shipping)"
