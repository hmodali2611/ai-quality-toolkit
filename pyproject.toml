[project]
name = "aiq"
version = "1.0.0"
description = "AI quality toolkit: CI failure triage for test suites, and an evaluation harness for LLM features (golden datasets, DeepEval, Promptfoo, Ragas)."
authors = [{ name = "Harika Modali" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
deepeval = ["deepeval>=3.0"]
ragas = ["ragas>=0.3", "langchain-community<0.4", "langchain-openai"]

[project.scripts]
aiq = "aiq.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
